<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Otto — per-app volume for Windows, done right">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1112"/>
      <stop offset="1" stop-color="#0a0d0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#46a873" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#46a873" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46a873"/>
      <stop offset="1" stop-color="#245e40"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8a5a"/>
      <stop offset="1" stop-color="#7fd3a3"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8a5a"/>
      <stop offset="1" stop-color="#7fd3a3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- icon tile -->
  <g transform="translate(88,88)">
    <rect width="144" height="144" rx="32" fill="url(#tile)"/>
    <g stroke="#1B4D33" stroke-width="7" stroke-linecap="round">
      <line x1="43" y1="32" x2="43" y2="112"/>
      <line x1="72" y1="32" x2="72" y2="112"/>
      <line x1="101" y1="32" x2="101" y2="112"/>
    </g>
    <g fill="#ffffff">
      <circle cx="43" cy="89" r="12"/>
      <circle cx="72" cy="58" r="12"/>
      <circle cx="101" cy="104" r="12"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(276,82) scale(0.66)" aria-label="Otto"><circle cx="42" cy="50" r="30" fill="none" stroke="#f2f5f4" stroke-width="13"/><rect x="108.5" y="20" width="13" height="60" rx="6.5" fill="#f2f5f4" opacity=".35"/><rect x="92" y="38" width="46" height="14" rx="7" fill="#7fd3a3"/><rect x="178.5" y="20" width="13" height="60" rx="6.5" fill="#f2f5f4" opacity=".35"/><rect x="162" y="58" width="46" height="14" rx="7" fill="#7fd3a3"/><circle cx="258" cy="50" r="30" fill="none" stroke="#f2f5f4" stroke-width="13"/></g>
  <text x="276" y="196" font-family="Figtree, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#b4c0bd">Per-app volume for Windows, done right.</text>

  <!-- mini mixer rows -->
  <g transform="translate(760,70)" font-family="Figtree, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f2f5f4">
    <rect x="-20" y="-18" width="400" height="216" rx="18" fill="#0f1314" stroke="#ffffff" stroke-opacity="0.08"/>
    <g>
      <rect x="0" y="4" width="28" height="28" rx="7" fill="#ea4335"/>
      <text x="40" y="18" font-weight="500">Google Chrome</text>
      <text x="356" y="18" text-anchor="end" fill="#8c979a" font-size="12">58</text>
      <rect x="40" y="30" width="316" height="4" rx="2" fill="#ffffff" fill-opacity="0.13"/>
      <rect x="40" y="30" width="183" height="4" rx="2" fill="url(#fill)"/>
      <circle cx="223" cy="32" r="7" fill="#ffffff"/>
      <rect x="40" y="40" width="98" height="2" rx="1" fill="#46a873" fill-opacity="0.75"/>
    </g>
    <g transform="translate(0,64)">
      <rect x="0" y="4" width="28" height="28" rx="7" fill="#5865f2"/>
      <text x="40" y="18" font-weight="500">Discord</text>
      <text x="356" y="18" text-anchor="end" fill="#8c979a" font-size="12">80</text>
      <rect x="40" y="30" width="316" height="4" rx="2" fill="#ffffff" fill-opacity="0.13"/>
      <rect x="40" y="30" width="253" height="4" rx="2" fill="url(#fill)"/>
      <circle cx="293" cy="32" r="7" fill="#ffffff"/>
      <rect x="40" y="40" width="38" height="2" rx="1" fill="#46a873" fill-opacity="0.75"/>
    </g>
    <g transform="translate(0,128)">
      <rect x="0" y="4" width="28" height="28" rx="7" fill="#1db954"/>
      <text x="40" y="18" font-weight="500">Spotify</text>
      <text x="356" y="18" text-anchor="end" fill="#8c979a" font-size="12">35</text>
      <rect x="40" y="30" width="316" height="4" rx="2" fill="#ffffff" fill-opacity="0.13"/>
      <rect x="40" y="30" width="110" height="4" rx="2" fill="url(#fill)"/>
      <circle cx="150" cy="32" r="7" fill="#ffffff"/>
      <rect x="40" y="40" width="140" height="2" rx="1" fill="#46a873" fill-opacity="0.75"/>
    </g>
